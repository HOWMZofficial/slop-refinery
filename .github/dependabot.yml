version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Denver

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Denver
      cooldown:
          semver-patch-days: 3
          semver-minor-days: 14
          semver-major-days: 30
      ignore:
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
